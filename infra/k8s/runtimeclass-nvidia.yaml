# The kai-resource-isolator webhook injects `runtimeClassName: nvidia` into every
# GPU pod; without this object, pod creation is rejected with
# "RuntimeClass nvidia not found". `handler: nvidia` matches the containerd
# runtime handler registered by kind-cluster.yaml's containerdConfigPatches.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
