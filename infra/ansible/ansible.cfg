[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = /usr/bin/python3
# Built-in YAML output (the community.general.yaml callback was removed in
# ansible-core 2.13+; result_format=yaml is the supported replacement).
stdout_callback      = default
result_format        = yaml
timeout              = 30

[ssh_connection]
pipelining           = True
# Tolerate first-boot host key churn; short connect timeout for fast failure.
# Deliberately NO ControlMaster/ControlPersist: this fleet destroys + recreates
# VMs at the SAME fixed IPs (node index -> IP is static), so a persisted
# control socket from a previous VM at an IP can still be "alive" when a new
# job's ansible run starts against the NEW VM at that same IP within the
# persist window — ssh multiplexing then silently reuses that stale
# connection against what's now a different, dead remote, and the run just
# hangs (live-reproduced: an ansible task blocked 10+ minutes on a `sudo`+
# python bootstrap that raw ssh to the same host completed instantly).
# The rest of this codebase's own ssh/scp calls (adapter.py) never used
# multiplexing either — this just makes ansible consistent with that.
ssh_args             = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
