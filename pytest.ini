; Test runner config. Deliberately NOT a pyproject.toml: this repo ships no
; packaging (the control plane is run as `python -m reconciler`, tooling is
; pinned in the nix dev shell), and a [project] table would imply an installable
; distribution that does not exist. This file configures a test runner and
; nothing else.
;
; Requires: pytest >= 7 (for `pythonpath`). Add it to shell.nix / flake.nix
; alongside the other pinned tooling; `pip install pytest` works on a non-nix
; host. `jsonschema` is optional — the contract test skips without it.
[pytest]
testpaths = tests
; tests/ has no __init__.py, so pytest prepends tests/ to sys.path, not the repo
; root — without this, `import reconciler` fails.
pythonpath = .
addopts = -q
