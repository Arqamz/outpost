<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Outpost</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a24; --panel2:#1b2430; --line:#243040;
    --txt:#e6edf3; --dim:#8b98a9; --accent:#4aa3ff;
    --ok:#3fb950; --warn:#d29922; --hot:#f85149; --gpu:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--txt);padding:24px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:18px;margin:0;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:13px}
  .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--hot);box-shadow:0 0 8px var(--hot)}
  .summary{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px;color:var(--dim);font-size:13px}
  .summary b{color:var(--txt);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card.host{background:linear-gradient(180deg,var(--panel2),var(--panel));border-color:#33405260}
  .card.remote{border-color:#2f6f5e60}
  .card.off{opacity:.5}
  .card h2{font-size:14px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .badge{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;
         background:#26313f;color:var(--dim);font-weight:600}
  .badge.gpu{background:#2a2140;color:var(--gpu)}
  .meta{color:var(--dim);font-size:12px;margin-bottom:12px}
  .metric{margin:10px 0}
  .metric .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .metric .row .lbl{color:var(--dim)}
  .metric .row .val{font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:6px;background:#0e141c;overflow:hidden;border:1px solid #1f2937}
  .bar>span{display:block;height:100%;border-radius:6px;transition:width .5s ease,background .5s}
  .foot{margin-top:14px;color:var(--dim);font-size:12px}

  .section{margin-top:28px}
  .section h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .section h2 .badge{background:#26313f;color:var(--dim)}
  table.jobtable{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);
                 border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.jobtable th{text-align:left;color:var(--dim);font-weight:600;padding:8px 12px;
                     border-bottom:1px solid var(--line);white-space:nowrap}
  table.jobtable td{padding:7px 12px;border-bottom:1px solid #1a212c;vertical-align:top}
  table.jobtable tr:last-child td{border-bottom:none}
  table.jobtable tbody tr{cursor:pointer}
  table.jobtable tbody tr:hover td{background:#16202c}
  table.jobtable tbody tr.sel td{background:#152234}
  .empty-row td{color:var(--dim);text-align:center;padding:18px;cursor:default}
  .empty-row:hover td{background:none !important}
  .err{color:var(--hot);font-size:11px;margin-top:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .trunc{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge.state-submitted,.badge.state-cancelled{background:#26313f;color:var(--dim)}
  .badge.state-provisioning,.badge.state-bootstrapping,.badge.state-running,
  .badge.state-collecting,.badge.state-teardown,.badge.state-validating{background:#1c3350;color:var(--accent)}
  .badge.state-promoted{background:#123321;color:var(--ok)}
  .badge.state-failed,.badge.state-rejected{background:#3a1616;color:var(--hot)}

  .logpanel{margin-top:14px;background:#0d1219;border:1px solid var(--line);border-radius:12px;
            overflow:hidden;display:none}
  .logpanel .logbar{display:flex;align-items:center;gap:10px;padding:8px 14px;
                     border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
  .logpanel .logbar b{color:var(--txt);font-weight:600}
  .logpanel pre{margin:0;padding:12px 14px;max-height:440px;overflow:auto;font-size:11.5px;
                line-height:1.55;color:#c9d4e0;white-space:pre-wrap;word-break:break-all}
  .btn{background:#1c2531;border:1px solid var(--line);color:var(--txt);border-radius:6px;
       padding:4px 10px;font-size:11px;cursor:pointer}
  .btn:hover{background:#26313f}

  /* k8s gangs (KAI + HAMi) */
  .gang{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .gang.gpu-edge{border-color:#3a2f5a80;background:linear-gradient(180deg,#1a1530,var(--panel))}
  .gang h3{font-size:13px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .gang .gmeta{color:var(--dim);font-size:11.5px;margin-bottom:10px}
  .pods{display:flex;flex-wrap:wrap;gap:6px}
  .pod{font-size:11px;padding:3px 8px;border-radius:999px;background:#0e141c;border:1px solid #1f2937;
       display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .pod .pdot{width:7px;height:7px;border-radius:50%}
  .pod .cap{color:var(--dim)}
  .ph-Running .pdot{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .ph-Succeeded .pdot{background:var(--ok)}
  .ph-Pending .pdot{background:var(--warn)}
  .ph-Failed .pdot{background:var(--hot)}

  /* Slinky cards */
  .slcard{margin-bottom:14px}
  .slcard .gmeta{margin:10px 0 4px}
  .slgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
  table.sltable{width:100%;border-collapse:collapse;font-size:11.5px}
  table.sltable th{text-align:left;color:var(--dim);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
  table.sltable td{padding:4px 8px;border-bottom:1px solid #1a212c;vertical-align:top}
  table.sltable .cap,.slcard .cap{color:var(--dim);font-size:11px}
  .kvs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .kv{font-size:11px;padding:2px 8px;border-radius:6px;background:#0e141c;border:1px solid #1f2937}
  .kv b{color:var(--dim);font-weight:600}
  .kv.bad,td.bad{color:var(--hot)}
  .warn{color:var(--warn);font-size:11px}
  .sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .sdot.ph-Running{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .sdot.ph-Succeeded{background:var(--ok)} .sdot.ph-Pending{background:var(--warn)} .sdot.ph-Failed{background:var(--hot)}
  table.sltable td{white-space:nowrap}
</style>
</head>
<body>
  <header>
    <h1>Outpost</h1>
    <span class="sub" id="uri">libvirt · cluster0 · 192.168.71.0/24</span>
    <span class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  </header>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>

  <div class="section" id="k8ssection" style="display:none">
    <h2>Kubernetes · KAI + HAMi <span class="badge" id="gangcount">0</span>
      <span class="sub" style="margin-left:8px">gangs sharing the one GPU (HAMi VRAM-capped per rank)</span>
    </h2>
    <div class="grid" id="gangs"></div>
  </div>

  <div class="section" id="slinkysection" style="display:none">
    <h2>Slinky · Slurm on Kubernetes <span class="badge" id="slinkycount">0</span>
      <span class="sub" style="margin-left:8px">outpost slots → Slurm nodes + queue, via the login pod</span>
    </h2>
    <div id="slinky"></div>
  </div>

  <div class="section">
    <h2>Jobs <span class="badge" id="jobcount">0</span>
      <button class="btn" id="clearJobs" style="margin-left:auto" title="wipe job history + logs, reset nodes to available">clear jobs</button>
    </h2>
    <table class="jobtable">
      <thead><tr>
        <th>job</th><th>name</th><th>state</th><th>launcher</th><th>nodes</th><th>image</th><th>updated</th>
      </tr></thead>
      <tbody id="jobrows"></tbody>
    </table>
  </div>

  <div class="logpanel" id="logpanel">
    <div class="logbar">
      <span>log · <b id="logtitle">—</b></span>
      <button class="btn" id="logclose">close</button>
      <button class="btn" id="logtimeline" style="margin-left:auto">cluster timeline</button>
    </div>
    <pre id="logbody"></pre>
  </div>

<script>
const fmtMiB = m => m==null ? "—" : (m>=1024 ? (m/1024).toFixed(1)+" GiB" : Math.round(m)+" MiB");
const clamp = v => Math.max(0, Math.min(100, v));
function color(pct){ return pct>=85 ? "var(--hot)" : pct>=60 ? "var(--warn)" : "var(--ok)"; }

function bar(label, pct, valText, tint){
  pct = pct==null ? 0 : clamp(pct);
  const c = tint || color(pct);
  return `<div class="metric">
    <div class="row"><span class="lbl">${label}</span><span class="val">${valText}</span></div>
    <div class="bar"><span style="width:${pct}%;background:${c}"></span></div>
  </div>`;
}

function card(n){
  const cpu = n.cpu_pct==null ? "—" : n.cpu_pct.toFixed(0)+"%";
  const memPct = (n.mem_used_mib!=null && n.mem_total_mib) ? n.mem_used_mib/n.mem_total_mib*100 : null;
  const memTxt = `${fmtMiB(n.mem_used_mib)} / ${fmtMiB(n.mem_total_mib)}`;
  let gpu = "";
  if(n.gpu){
    const g=n.gpu, gmem=g.mem_used_mib/g.mem_total_mib*100;
    gpu = bar("GPU "+ (g.temp_c!=null?`· ${g.temp_c.toFixed(0)}°C`:""), g.util_pct, g.util_pct.toFixed(0)+"%", "var(--gpu)")
        + bar("VRAM", gmem, `${fmtMiB(g.mem_used_mib)} / ${fmtMiB(g.mem_total_mib)}`, "var(--gpu)");
  }
  const label = n.kind==='host' ? 'gpu · host' : (n.kind==='remote' ? 'cpu · ec2' : 'vm');
  const offline = (n.kind==='remote' && n.reachable===false);
  const meta = offline ? 'unreachable' : `${n.vcpus==null?'—':n.vcpus} vCPU`;
  return `<div class="card ${n.kind}${offline?' off':''}">
    <h2>${n.name} <span class="badge ${n.kind==='host'?'gpu':''}">${label}</span></h2>
    <div class="meta">${meta}</div>
    ${bar("CPU", n.cpu_pct, cpu)}
    ${bar("RAM", memPct, memTxt)}
    ${gpu}
  </div>`;
}

async function tick(){
  try{
    const r = await fetch("/api/stats.json",{cache:"no-store"});
    const d = await r.json();
    document.getElementById("dot").classList.remove("off");
    document.getElementById("status").textContent = "live · " + new Date(d.ts*1000).toLocaleTimeString();
    const workers = d.nodes.filter(n=>n.kind==='vm'||n.kind==='remote');
    const avgCpu = workers.length ? workers.reduce((a,n)=>a+(n.cpu_pct||0),0)/workers.length : 0;
    const memUsed = d.nodes.reduce((a,n)=>a+(n.mem_used_mib||0),0);
    const remote = d.nodes.filter(n=>n.kind==='remote').length;
    document.getElementById("summary").innerHTML =
      `nodes <b>${d.nodes.length}</b> &nbsp;·&nbsp; workers <b>${workers.length}</b>`+
      (remote?` <span style="opacity:.7">(${remote} ec2)</span>`:``)+` &nbsp;·&nbsp; `+
      `avg worker CPU <b>${avgCpu.toFixed(0)}%</b> &nbsp;·&nbsp; total RAM in use <b>${fmtMiB(memUsed)}</b>`;
    document.getElementById("grid").innerHTML = d.nodes.map(card).join("");
  }catch(e){
    document.getElementById("dot").classList.add("off");
    document.getElementById("status").textContent = "cluster unreachable";
  }
}

// ── k8s gangs (KAI + HAMi) ─────────────────────────────────────────────────
function gangCard(g){
  const done = g.pods.filter(p => p.phase==='Succeeded').length;
  const running = g.pods.filter(p => p.phase==='Running').length;
  const mm = g.min_member || g.pods.length;
  const pods = g.pods.map(p => {
    const cap = p.gpu_memory_mb ? `<span class="cap">${p.gpu_memory_mb}Mi</span>` : "";
    return `<span class="pod ph-${p.phase}"><span class="pdot"></span>${esc(p.name)} ${cap}</span>`;
  }).join("");
  return `<div class="gang gpu-edge">
    <h3>${esc(g.job||g.namespace)} <span class="badge gpu">gang ${mm}</span></h3>
    <div class="gmeta">${g.pods.length} pod(s) · ${running} running · ${done} done`+
    (g.podgroup?` · <span class="mono">${esc(g.podgroup)}</span>`:``)+`</div>
    <div class="pods">${pods}</div>
  </div>`;
}

async function renderK8s(){
  try{
    const r = await fetch("/api/k8s.json",{cache:"no-store"});
    const d = await r.json();
    const sec = document.getElementById("k8ssection");
    if(!d.enabled){ sec.style.display = "none"; return; }
    sec.style.display = "block";
    document.getElementById("gangcount").textContent = d.gangs.length;
    document.getElementById("gangs").innerHTML = d.gangs.length ? d.gangs.map(gangCard).join("") :
      `<div class="gang" style="color:var(--dim)">no active gangs — submit a backend:k8s job</div>`;
  }catch(e){ /* leave last render; k8s panel is best-effort */ }
}

// ── Slinky clusters ─────────────────────────────────────────────────────────
const SLURM_PHASE = s => /^(ALLOC|MIX)/i.test(s) ? "Running" : /^IDLE/i.test(s) ? "Succeeded" :
                         /(DOWN|DRAIN|FAIL|UNK|NOT_RESP)/i.test(s) ? "Failed" : "Pending";
const JOB_PHASE = s => /^RUNNING/.test(s) ? "Running" : /^PENDING/.test(s) ? "Pending" :
                       /^COMPLETED/.test(s) ? "Succeeded" : "Failed";
const dot = ph => `<span class="sdot ph-${ph}"></span>`;
const gib = mb => mb == null ? "—" : (mb / 1024).toFixed(1);
const ago = t => { if(!t) return "—"; const s = Math.max(0, Date.now()/1000 - t);
  return s < 90 ? `${s|0}s` : s < 5400 ? `${(s/60)|0}m` : `${(s/3600).toFixed(1)}h`; };
const dur = s => s == null ? "—" : s < 90 ? `${s|0}s` : s < 5400 ? `${(s/60).toFixed(1)}m` : `${(s/3600).toFixed(1)}h`;
const outp = o => { if(!o) return ""; const [id, name] = o.split("|");
  return `<span class="mono">${shortId(id)}</span> <span class="cap">${esc(name)}</span>`; };
const tbl = (head, rows, empty) => `<table class="sltable"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${rows.length ? rows.join("") : `<tr><td colspan="${head.length}" class="cap">${empty}</td></tr>`}</tbody></table>`;
const kv = (k, v, cls="") => `<span class="kv ${cls}"><b>${esc(k)}</b> ${esc(String(v ?? "—"))}</span>`;

function slinkyCard(c){
  const ctl = c.controller || {};
  const ctlPod = (c.pods||[]).find(p => p.name.startsWith("slurm-controller"));
  const workerNodes = new Set((c.nodes||[]).map(n => n.k8s_node));
  const ctlOnWorker = ctlPod && workerNodes.has(ctlPod.node);
  const conf = c.config || {}, d = c.diag || {};
  const noTask = /null/.test(conf.TaskPlugin || "");
  const head = `<h3>${esc(c.context)} ${c.gpu?'<span class="badge gpu">gpu</span>':''}
      <span class="badge ${ctl.up?'state-promoted':'state-failed'}">slurmctld ${ctl.up?'UP':'DOWN'}</span>
      <span class="cap">Slurm ${esc(c.version||"?")}</span></h3>
    <div class="gmeta">controller ${esc(ctl.host||"?")}${ctl.latency_us?` · ping ${(ctl.latency_us/1000).toFixed(1)}ms`:""}
      ${ctlPod?` · pod on <span class="mono">${esc(ctlPod.node)}</span> · ${ctlPod.restarts} restart(s)`:""}
      ${ctlOnWorker?` <span class="warn">⚠ shares a GPU worker with jobs</span>`:""}
      · login <span class="mono">${esc(c.login_pod||"—")}</span>
      ${(c.partitions||[]).map(p=>` · partition <b>${esc(p.name)}</b>${p.default?"*":""} ${esc(p.state)} ${p.cpus} cpus, max ${p.max_time==="inf"?"∞":p.max_time}`).join("")}
      ${ctl.up ? "" : `<div class="err">${esc(ctl.status||"")}</div>`}</div>`;
  const err = c.reachable ? "" : `<div class="err">unreachable: ${esc(c.error)}</div>`;
  const stats = `<div class="kvs">
      ${kv("submitted", d.jobs_submitted)}${kv("started", d.jobs_started)}${kv("completed", d.jobs_completed)}
      ${kv("failed", d.jobs_failed, d.jobs_failed?"bad":"")}${kv("canceled", d.jobs_canceled)}
      ${kv("running", d.jobs_running)}${kv("pending", d.jobs_pending)}
      ${kv("sched cycle", d.schedule_cycle_mean!=null?`${d.schedule_cycle_mean}µs mean / ${d.schedule_cycle_max}µs max`:null)}
      ${kv("ctld up", d.req_time_start?ago(d.req_time_start):null)}</div>
    <div class="kvs">
      ${kv("select", `${conf.SelectType||"?"} ${conf.SelectTypeParameters||""}`)}
      ${kv("task", conf.TaskPlugin, noTask?"bad":"")}${kv("proctrack", conf.ProctrackType)}
      ${kv("cgroup", conf.CgroupPlugin)}${kv("mpi default", conf.MpiDefault)}${kv("gres", conf.GresTypes)}
      ${kv("acct gather", conf.JobAcctGatherType)}${kv("sched", conf.SchedulerType)}
      ${noTask?`<span class="warn">no task plugin: no CPU binding, no memory/GPU confinement per job</span>`:""}</div>`;
  const slots = tbl(["slot","Slurm node","GPUs","state","held by"], (c.slots||[]).map(s =>
    `<tr><td class="mono">${esc(s.name)}</td><td class="mono">${esc(s.slurm_node||"(cluster-wide)")}</td>
     <td>${s.gpu_count||"—"}</td><td>${dot(s.owner_job?"Running":"Succeeded")} ${esc(s.state)}</td>
     <td>${s.owner_job?`<span class="mono">${shortId(s.owner_job)}</span> <span class="cap">${esc(s.owner_name)}</span>`:""}</td></tr>`), "no slots");
  const nodes = tbl(["node","state","CPUs alloc/total","load","mem alloc · free / total GiB","GPUs (used)","pod → k8s node","slurmd up","reason"],
    (c.nodes||[]).map(n => `<tr><td class="mono">${esc(n.name)}<div class="cap">${esc(n.address||"")} · ${n.sockets}s×${n.cores}c×${n.threads}t</div></td>
     <td>${dot(SLURM_PHASE(n.state))} ${esc(n.state)}</td><td>${n.alloc_cpus}/${n.cpus}</td><td>${n.cpu_load.toFixed(2)}</td>
     <td>${gib(n.alloc_memory_mb)} · ${gib(n.free_memory_mb)} / ${gib(n.real_memory_mb)}</td>
     <td class="mono">${esc(n.gres)}<div class="cap">${esc(n.gres_used)}</div></td>
     <td class="mono">${esc(n.pod)}<div class="cap">${esc(n.k8s_node)}</div></td>
     <td>${ago(n.slurmd_start)}</td><td class="cap">${esc(n.reason)}</td></tr>`), "no Slurm nodes");
  const now = Date.now()/1000;
  const queue = tbl(["id","outpost job","state","nodes","CPUs","TRES","per node","elapsed","limit"],
    (c.queue||[]).map(q => `<tr><td class="mono">${q.id}</td><td>${outp(q.outpost) || esc(q.name)}</td>
     <td>${dot(JOB_PHASE(q.state))} ${esc(q.state)}${q.state==="PENDING"?` <span class="cap">${esc(q.reason)}</span>`:""}</td>
     <td class="mono">${q.node_count} · ${esc(q.nodes)}</td><td>${q.cpus??"—"}</td><td class="mono cap">${esc(q.tres)}</td>
     <td class="mono">${esc(q.tres_per_node)}</td><td>${q.start&&q.start<=now?dur(now-q.start):"—"}</td>
     <td>${q.time_limit==="inf"?"∞":q.time_limit??"—"}</td></tr>`), "queue empty");
  const hist = tbl(["id","outpost job","state","elapsed","nodes","exit","TRES"],
    (c.history||[]).map(h => `<tr><td class="mono">${h.id}</td><td>${outp(h.outpost) || esc(h.name)}</td>
     <td>${dot(JOB_PHASE(h.state))} ${esc(h.state)}</td><td>${dur(h.elapsed_s)}</td><td class="mono">${esc(h.nodes)}</td>
     <td>${h.exit??"—"}${h.signal?` <span class="cap">${esc(h.signal)}</span>`:""}</td><td class="mono cap">${esc(h.tres)}</td></tr>`), "no recent jobs");
  const pods = tbl(["pod","phase","ready","restarts","k8s node"],
    (c.pods||[]).map(p => `<tr><td class="mono">${esc(p.name)}</td><td>${dot(p.phase==="Running"?"Running":p.phase==="Succeeded"?"Succeeded":"Failed")} ${esc(p.phase)}</td>
     <td>${p.ready}</td><td class="${p.restarts?"bad":""}">${p.restarts}</td><td class="mono">${esc(p.node)}</td></tr>`), "no pods");
  return `<div class="gang slcard ${c.gpu?'gpu-edge':''}">${head}${err}${stats}
    <div class="slgrid"><div><div class="gmeta">outpost slots</div>${slots}</div>
      <div><div class="gmeta">Kubernetes pods (namespace slurm)</div>${pods}</div></div>
    <div class="gmeta">Slurm nodes</div>${nodes}
    <div class="gmeta">queue</div>${queue}
    <div class="gmeta">history (sacct, newest first)</div>${hist}
  </div>`;
}

async function renderSlinky(){
  try{
    const d = await (await fetch("/api/slinky.json",{cache:"no-store"})).json();
    const sec = document.getElementById("slinkysection");
    if(!d.enabled){ sec.style.display = "none"; return; }
    sec.style.display = "block";
    document.getElementById("slinkycount").textContent = d.clusters.length;
    document.getElementById("slinky").innerHTML = d.clusters.map(slinkyCard).join("");
  }catch(e){ /* best-effort, like the k8s panel */ }
}

// ── job queue + log viewer ─────────────────────────────────────────────────
let selectedJob = null;

// What each state actually means — shown as a hover tooltip on the badge, so
// the dashboard is self-explanatory without needing docs open alongside it.
const STATE_EXPLAIN = {
  submitted:     "queued — waiting for capacity, or about to be scheduled this tick",
  provisioning:  "claiming its nodes and making sure each is genuinely reachable",
  bootstrapping: "installing/verifying apptainer + MPI on its nodes",
  running:       "the container (or mpirun, for multi-node jobs) is actually executing",
  collecting:    "copying stdout.log + output_dir from the node(s) to the drop-zone",
  teardown:      "releasing its nodes back to the pool",
  validating:    "running acceptance gates (currently a stub — always passes through)",
  promoted:      "SUCCESS — terminal. Finished cleanly, gates passed, output is in the drop-zone.",
  failed:        "FAILURE — terminal. Something in the pipeline broke (bad command, node died, " +
                 "timed out waiting for capacity, non-zero exit, ...) — see the error below, or " +
                 "the job's full log. Don't trust the drop-zone contents as complete.",
  rejected:      "terminal — a gate explicitly rejected the output (not wired up yet; gates are a stub)",
  cancelled:     "terminal — an operator cancelled this job",
};

function shortId(id){ return id ? id.replace(/^job-/,"").slice(0,8) : ""; }
function fmtTs(ts){ return ts ? new Date(ts).toLocaleTimeString() : "—"; }
function esc(s){ return (s??"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function jobRow(j){
  const got = j.assigned_nodes ? j.assigned_nodes.length : 0;
  const nodes = j.backend_slot ? `<span title="slot ${esc(j.backend_slot)}">${j.node_count} · ${esc(j.backend_slot.split("-")[0])}</span>`
                               : `${got}/${j.node_count}`;
  const err = j.error ? `<div class="err">${esc(j.error)}</div>` : "";
  const explain = esc(STATE_EXPLAIN[j.state] || "");
  return `<tr data-job="${j.job_id}" class="${selectedJob===j.job_id?'sel':''}">
    <td class="mono">${shortId(j.job_id)}</td>
    <td>${esc(j.name)}${err}</td>
    <td><span class="badge state-${j.state}" title="${explain}">${j.state}</span></td>
    <td>${j.launcher}${j.gpu?" · gpu":""}</td>
    <td>${nodes}</td>
    <td class="mono trunc" title="${esc(j.image)}">${esc(j.image)}</td>
    <td>${fmtTs(j.updated_at)}</td>
  </tr>`;
}

async function loadLog(jobId, title){
  selectedJob = jobId;
  document.getElementById("logpanel").style.display = "block";
  document.getElementById("logtitle").textContent = title;
  try{
    const r = await fetch(`/api/logs?job=${encodeURIComponent(jobId)}`, {cache:"no-store"});
    const txt = await r.text();
    const body = document.getElementById("logbody");
    const wasAtBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 24;
    body.textContent = txt;
    if(wasAtBottom) body.scrollTop = body.scrollHeight;
  }catch(e){}
}

async function renderJobs(){
  try{
    const r = await fetch("/api/jobs.json", {cache:"no-store"});
    const jobs = await r.json();
    document.getElementById("jobcount").textContent = jobs.length;
    document.getElementById("jobrows").innerHTML = jobs.length ? jobs.map(jobRow).join("") :
      `<tr class="empty-row"><td colspan="7">no jobs submitted yet — bin/cluster submit --spec job.yaml</td></tr>`;
    document.querySelectorAll("#jobrows tr[data-job]").forEach(tr => {
      tr.onclick = () => {
        const j = jobs.find(x => x.job_id === tr.dataset.job);
        loadLog(j.job_id, `${j.name} (${shortId(j.job_id)})`);
      };
    });
    if(selectedJob && selectedJob !== "__reconciler__") loadLog(selectedJob, document.getElementById("logtitle").textContent);
  }catch(e){}
}

document.getElementById("logclose").onclick = () => {
  selectedJob = null;
  document.getElementById("logpanel").style.display = "none";
};
document.getElementById("logtimeline").onclick = () => loadLog("__reconciler__", "cluster timeline (all jobs, chronological)");

document.getElementById("clearJobs").onclick = async () => {
  if(!confirm("Clear all job history + logs, and reset every node to available?\n\nThis is for a clean demo view — it doesn't touch VMs/GPU, only the job queue and its logs.")) return;
  let res = await (await fetch("/api/clear", {method:"POST"})).json();
  if(!res.cleared){
    const names = res.active.map(a => `  ${a.job_id}  ${a.state}`).join("\n");
    const force = confirm(`${res.active.length} job(s) still active, not terminal:\n${names}\n\n` +
      `Force clear anyway? This releases their nodes even if real infrastructure is still running for them.`);
    if(!force) return;
    res = await (await fetch("/api/clear?force=1", {method:"POST"})).json();
  }
  selectedJob = null;
  document.getElementById("logpanel").style.display = "none";
  renderJobs();
};

tick(); renderJobs(); renderK8s(); renderSlinky();
setInterval(tick, 2000);
setInterval(renderJobs, 2000);
setInterval(renderK8s, 2000);
setInterval(renderSlinky, 5000);
setInterval(() => { if(selectedJob === "__reconciler__") loadLog("__reconciler__", document.getElementById("logtitle").textContent); }, 2000);
</script>
</body>
